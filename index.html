 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SW1 - Club Roster // Player Select</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(212, 175, 55, 0.16), transparent 45%),
                repeating-linear-gradient(
                    0deg,
                    rgba(255, 255, 255, 0.02) 0px,
                    rgba(255, 255, 255, 0.02) 1px,
                    transparent 1px,
                    transparent 4px
                ),
                #090b10;
            color: #f8fafc;
            font-family: 'Rajdhani', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* Main Game Menu Frame */
        .game-shell {
            width: 100%;
            max-width: 780px;
            background: linear-gradient(160deg, #121722 0%, #0b0e15 100%);
            border: 2px solid #d4af37;
            border-radius: 14px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.2), inset 0 0 24px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        /* Top HUD Bar */
        .hud-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: #161c2a;
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            font-family: 'Orbitron', sans-serif;
            font-size: 0.78rem;
            letter-spacing: 1.5px;
            color: #d4af37;
        }

        .hud-dot {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 8px #22c55e;
            margin-right: 8px;
        }

        .menu-body {
            padding: 28px 26px 32px;
        }

        .title-block {
            text-align: center;
            margin-bottom: 24px;
        }

        .quest-tag {
            display: inline-block;
            padding: 3px 12px;
            border: 1px solid #d4af37;
            border-radius: 999px;
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: #facc15;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            color: #d4af37;
            font-size: 2.2rem;
            margin: 4px 0;
            text-shadow: 0 0 14px rgba(212, 175, 55, 0.45);
            letter-spacing: 2px;
        }

        .subtitle {
            margin: 0;
            color: #94a3b8;
            font-size: 1.05rem;
        }

        /* Two-Column Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: 1.15fr 0.85fr;
            gap: 20px;
        }

        @media (max-width: 680px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }

        .panel {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(212, 175, 55, 0.35);
            border-radius: 10px;
            padding: 18px;
        }

        .panel-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            color: #facc15;
            letter-spacing: 1.5px;
            margin: 0 0 14px;
            text-transform: uppercase;
        }

        label {
            display: block;
            font-size: 0.85rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #cbd5e1;
            margin-bottom: 4px;
        }

        input[type="text"] {
            width: 100%;
            background: #090d16;
            border: 1px solid #d4af37;
            color: #ffffff;
            padding: 10px 12px;
            margin-bottom: 14px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.05rem;
            border-radius: 6px;
            outline: none;
        }

        input[type="text"]:focus {
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.45);
        }

        /* Game Action Buttons */
        .btn-row {
            display: flex;
            gap: 10px;
        }

        .game-btn {
            flex: 1;
            padding: 12px 14px;
            border: none;
            border-radius: 6px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            text-transform: uppercase;
            transition: transform 0.12s ease, box-shadow 0.12s ease;
        }

        .btn-start {
            background: linear-gradient(135deg, #facc15, #ca8a04);
            color: #090b10;
            box-shadow: 0 4px 14px rgba(250, 204, 21, 0.3);
        }

        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(250, 204, 21, 0.5);
        }

        .btn-clear {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #475569;
        }

        .btn-clear:hover {
            background: #334155;
        }

        /* Quick-Select Roster Pills */
        .preset-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .preset-btn {
            text-align: left;
            background: #111827;
            border: 1px solid rgba(148, 163, 184, 0.3);
            color: #e2e8f0;
            padding: 9px 12px;
            border-radius: 6px;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: border-color 0.15s, background 0.15s, transform 0.1s;
        }

        .preset-btn:hover {
            border-color: #facc15;
            background: #1e293b;
            transform: translateX(4px);
        }

        .preset-btn span {
            color: #facc15;
            margin-right: 6px;
        }

        /* Status / Mission Outcome Screen */
        .status-screen {
            margin-top: 20px;
            padding: 16px 18px;
            border-radius: 8px;
            background: #070a10;
            border: 1px dashed rgba(212, 175, 55, 0.5);
            min-height: 76px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            letter-spacing: 1px;
            color: #94a3b8;
        }

        .status-granted {
            border: 2px solid #22c55e;
            color: #4ade80;
            background: rgba(20, 83, 45, 0.25);
            box-shadow: 0 0 18px rgba(34, 197, 94, 0.25);
        }

        .status-denied {
            border: 2px solid #ef4444;
            color: #f87171;
            background: rgba(127, 29, 29, 0.25);
            box-shadow: 0 0 18px rgba(239, 68, 68, 0.25);
        }
    </style>
</head>
<body>
    <div class="game-shell">
        <div class="hud-bar">
            <div><span class="hud-dot"></span>SYSTEM ONLINE</div>
            <div>SW1 // CLUB GATEWAY v1.0</div>
        </div>

        <div class="menu-body">
            <div class="title-block">
                <div class="quest-tag">Character Verification</div>
                <h1>Gooner Club</h1>
                <p class="subtitle">Enter player credentials or pick a preset slot to verify roster access.</p>
            </div>

            <div class="menu-grid">
                <!-- Left Panel: Player Input -->
                <div class="panel">
                    <h2 class="panel-title">01. Player Login</h2>
                    <form onsubmit="return false;">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" placeholder="e.g. Ethan">

                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" placeholder="e.g. de leon">

                        <div class="btn-row">
                            <button type="button" id="enter_btn" class="game-btn btn-start">▶ Verify Player</button>
                            <button type="button" id="reset_btn" class="game-btn btn-clear">Reset</button>
                        </div>
                    </form>
                </div>

                <!-- Right Panel: Quick-Select Character Slots -->
                <div class="panel">
                    <h2 class="panel-title">02. Quick Select</h2>
                    <div class="preset-list">
                        <button type="button" class="preset-btn" data-first="Ethan" data-last="de leon"><span>▶</span>SLOT 01: Ethan de leon</button>
                        <button type="button" class="preset-btn" data-first="bong bong" data-last="marcos"><span>▶</span>SLOT 02: bong bong marcos</button>
                        <button type="button" class="preset-btn" data-first="spider" data-last="man"><span>▶</span>SLOT 03: spider man</button>
                        <button type="button" class="preset-btn" data-first="jose" data-last="rizal"><span>▶</span>SLOT 04: jose rizal</button>
                        <button type="button" class="preset-btn" data-first="Guest" data-last="Player"><span>▶</span>SLOT 05: Guest Player (Test Deny)</button>
                    </div>
                </div>
            </div>

            <div id="result" class="status-screen">
                AWAITING PLAYER INPUT...
            </div>
        </div>
    </div>

    <script type="py" src="./main.py"></script>
</body>
</html>
