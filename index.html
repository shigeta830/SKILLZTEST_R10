<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Non-Metal Finder</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
    <style>
        button {
            padding: 8px 15px;
            background: gold;
            color: black;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.08);
        }
    </style>
</head>
<body style="background-color: black; color: gold; font-family: Arial; text-align: center; padding-top: 50px;">
    <h2>Non-Metal Finder</h2>
    <input type="text" id="element_input" placeholder="Enter Symbol (e.g. H, O)" style="padding: 8px; border: 1px solid gold; background: black; color: gold;">
    <button id="search_btn" type="button">Search</button>
    <div id="Result" style="margin: 20px auto; width: 250px; border: 1px solid gold; padding: 15px; text-align: left; color: white;"></div>
    <script type="py" src="./main.py"></script>
</body>
</html>
