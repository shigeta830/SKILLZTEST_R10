<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SW1 Checker</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
  <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
  <style>
    body {
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
    }
    input, button {
      padding: 10px;
      margin: 6px;
      font-size: 16px;
    }
    button {
      background: gold;
      color: #111;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 20px;
      font-size: 20px;
      color: gold;
    }
  </style>
</head>
<body>
  <h1>Club Checker</h1>
  <input type="text" id="first_name" placeholder="First name"><br>
  <input type="text" id="last_name" placeholder="Last name"><br>
  <button id="check_btn" type="button">Check</button>
  <div id="result"></div>

  <script type="py" src="./main.py"></script>
</body>
</html>
